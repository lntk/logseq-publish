<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Published Logseq Page</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --link: #0969da;
      --code-bg: #f6f8fa;
      --quote: #6e7781;
      --max: 860px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --link: #58a6ff;
        --code-bg: #161b22;
        --quote: #8b949e;
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--fg); }
    body {
      margin: 0;
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main { max-width: var(--max); margin: 0 auto; padding: 56px 24px 96px; }
    article { overflow-wrap: anywhere; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.7em 0 .65em; }
    h1 { font-size: 2.15rem; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
    h2 { font-size: 1.55rem; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
    h3 { font-size: 1.25rem; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 1rem; }
    ul, ol { padding-left: 1.7rem; }
    li + li { margin-top: .2rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--code-bg);
      border-radius: 5px;
      padding: .15em .35em;
      font-size: .9em;
    }
    pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow: auto; }
    pre code { padding: 0; background: transparent; }
    blockquote { margin-left: 0; padding-left: 1rem; color: var(--quote); border-left: 4px solid var(--border); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 6px 12px; }
    img { max-width: 100%; height: auto; border-radius: 6px; }
    input[type="checkbox"] { margin-right: .45rem; }
    .status { color: var(--muted); }
    .error { padding: 16px; border: 1px solid var(--border); border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <article id="content"><p class="status">Loading…</p></article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    const target = document.getElementById('content');

    function normalizeLogseq(markdown) {
      return markdown
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/^([ \t]*)- TODO /gm, '$1- [ ] ')
        .replace(/^([ \t]*)- DOING /gm, '$1- [ ] ')
        .replace(/^([ \t]*)- DONE /gm, '$1- [x] ');
    }

    async function render() {
      try {
        const response = await fetch(`page.md?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not load page.md (${response.status})`);
        const raw = await response.text();
        const markdown = normalizeLogseq(raw);
        const rendered = marked.parse(markdown, { gfm: true, breaks: false });
        target.innerHTML = DOMPurify.sanitize(rendered);
        const firstHeading = raw.match(/^#\s+(.+)$/m);
        if (firstHeading) document.title = firstHeading[1].replace(/[*_`]/g, '').trim();
      } catch (error) {
        target.innerHTML = `<div class="error"><strong>Nothing published yet.</strong><p>Upload a Markdown file named <code>page.md</code> to this repository.</p><p class="status">${String(error.message || error)}</p></div>`;
      }
    }

    render();
  </script>
</body>
</html>
