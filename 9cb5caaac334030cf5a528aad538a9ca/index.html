<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'" />
  <title>Published Logseq Page</title>
  <link rel="stylesheet" href="/logseq-publish/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" crossorigin="anonymous" />
</head>
<body>
  <main>
    <article id="content"><p class="status">Loading…</p></article>
  </main>

  <aside id="publisher" hidden>
    <div id="publisher-ready" hidden>
      <div class="publisher-row">
        <button class="primary" id="choose-file">Publish .md</button>
        <button id="publisher-settings" title="Publisher settings">Settings</button>
        <input id="file-input" type="file" accept=".md,text/markdown,text/plain" hidden />
      </div>
      <div id="publish-status">Drop a Markdown file anywhere on this page.</div>
      <div id="publish-result"></div>
    </div>
    <div id="publisher-setup" hidden>
      <div><strong>Enable publishing in this browser</strong></div>
      <p class="small">Drop a .md now; on the first publish only, add a fine-grained GitHub token restricted to <code>lntk/logseq-publish</code> with <strong>Contents: read and write</strong>. The token stays in this browser.</p>
      <div class="publisher-row">
        <a class="button-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create token</a>
      </div>
      <div class="publisher-row">
        <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_…" />
        <button class="primary" id="save-token">Save & publish</button>
      </div>
      <div id="setup-status" class="small"></div>
    </div>
  </aside>

  <div id="drop-overlay" hidden>Drop .md to publish</div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.10/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="/logseq-publish/app.js"></script>
</body>
</html>
