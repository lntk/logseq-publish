<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'" />
  <title>Notes</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css" integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1" crossorigin="anonymous" />
</head>
<body>
  <main>
    <article id="content"><p class="status">Loading…</p></article>
  </main>

  <aside id="publisher" hidden aria-label="Publish Markdown">
    <div id="publisher-ready" hidden>
      <div class="publisher-row">
        <button class="primary" id="choose-file" type="button">Publish .md</button>
        <span class="publisher-hint">or drop anywhere</span>
        <button class="icon-button" id="publisher-settings" type="button" title="Publisher settings" aria-label="Publisher settings">•••</button>
        <input id="file-input" type="file" accept=".md,text/markdown,text/plain" hidden />
      </div>
      <div id="publish-status" aria-live="polite"></div>
      <div id="publish-result"></div>
    </div>

    <div id="publisher-setup" hidden>
      <div class="setup-heading">Connect GitHub</div>
      <p class="small">One-time setup. Use a fine-grained token for this repository with <strong>Contents: read and write</strong>.</p>
      <div class="publisher-row setup-actions">
        <a class="text-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create token</a>
      </div>
      <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub token" />
      <div class="publisher-row setup-actions">
        <button class="primary" id="save-token" type="button">Connect</button>
        <button id="cancel-setup" type="button">Cancel</button>
      </div>
      <div id="setup-status" class="small" aria-live="polite"></div>
    </div>
  </aside>

  <div id="drop-overlay" hidden>Drop to publish</div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js" integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.4/lib/index.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
